<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tile Dungeon</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #f6e05e;
      --btn: #21262d;
      --btn-hover: #30363d;
      --hp: #48bb78;
      --hp-low: #e53e3e;
      --hp-bg: #21262d;
      --stairs: #63b3ed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 12px;
      padding: 16px;
    }
    h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent);
    }
    .layout {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-start;
      justify-content: center;
      max-width: 1100px;
      width: 100%;
    }
    .main-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1 1 640px;
      min-width: 0;
      max-width: 820px;
    }
    #hud {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
      padding: 10px 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.4;
      width: 100%;
    }
    #hud.game-over {
      border-color: var(--hp-low);
    }
    #hud.on-stairs {
      border-color: var(--stairs);
    }
    #hud .stat span.label { color: var(--muted); }
    #hud .stat span.value { color: var(--text); font-weight: 600; }
    #hud .controls { color: var(--muted); width: 100%; font-size: 11px; }
    .hp-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .hp-bar {
      width: 88px;
      height: 8px;
      background: var(--hp-bg);
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .hp-bar > span {
      display: block;
      height: 100%;
      width: 100%;
      background: var(--hp);
    }
    .hp-bar > span.low { background: var(--hp-low); }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-left: auto;
      flex-wrap: wrap;
    }
    #new-seed, #restart, #descend {
      background: var(--btn);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    #new-seed:hover, #restart:hover, #descend:hover:not(:disabled) {
      background: var(--btn-hover);
    }
    #descend:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    #descend:not(:disabled) {
      border-color: var(--stairs);
      color: var(--stairs);
    }
    canvas {
      border: 1px solid var(--border);
      background: var(--bg);
      image-rendering: pixelated;
      max-width: 100%;
      height: auto;
      width: 100%;
    }
    #message-log {
      width: 100%;
      height: 110px;
      overflow-y: auto;
      padding: 8px 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
    }
    #message-log .log-line { color: var(--text); }
    #message-log .log-line:last-child { color: var(--accent); }
    .side-col {
      flex: 0 1 240px;
      width: 100%;
      max-width: 260px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .side-col h2 {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    #inventory {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .inv-slot {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      background: var(--btn);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 5px 8px;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }
    .inv-slot:hover:not(:disabled) { background: var(--btn-hover); }
    .inv-slot:disabled {
      opacity: 0.55;
      cursor: default;
    }
    .inv-slot[data-kind="potion"] { border-left: 3px solid #ed64a6; }
    .inv-slot[data-kind="weapon"] { border-left: 3px solid #a0aec0; }
    .inv-slot[data-kind="armor"] { border-left: 3px solid #c05621; }
    .inv-key {
      color: var(--accent);
      font-weight: 700;
      min-width: 1.1em;
    }
    .inv-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .equip-line {
      font-size: 11px;
      color: var(--muted);
      padding: 0 2px;
    }
    .equip-line .value { color: var(--text); font-weight: 600; }
  </style>
</head>
<body>
  <h1>Tile Dungeon</h1>
  <div class="layout">
    <div class="main-col">
      <div id="hud" aria-live="polite">
        <div class="stat"><span class="label">seed</span> <span class="value" data-hud="seed">—</span></div>
        <div class="stat"><span class="label">depth</span> <span class="value" data-hud="depth">—</span></div>
        <div class="stat hp-wrap">
          <span class="label">hp</span>
          <span class="value" data-hud="hp">—</span>
          <div class="hp-bar" title="Player HP"><span data-hud="hp-bar"></span></div>
        </div>
        <div class="stat"><span class="label">atk</span> <span class="value" data-hud="atk">—</span></div>
        <div class="stat"><span class="label">def</span> <span class="value" data-hud="def">—</span></div>
        <div class="stat"><span class="label">pos</span> <span class="value" data-hud="pos">—</span></div>
        <div class="stat"><span class="label">turn</span> <span class="value" data-hud="turn">—</span></div>
        <div class="stat"><span class="label">kills</span> <span class="value" data-hud="kills">—</span></div>
        <div class="stat"><span class="label">explored</span> <span class="value" data-hud="explored">—</span></div>
        <div class="btn-row">
          <button type="button" id="descend" title="Descend stairs (> / Enter on stairs)" disabled>Descend</button>
          <button type="button" id="restart" title="Restart same seed">Restart</button>
          <button type="button" id="new-seed" title="New random seed">New Seed</button>
        </div>
        <div class="controls">Move: Arrows/WASD · Wait: Space · Attack: bump · 1-9: use/equip · H: potion · G: get · &gt;/Enter on stairs: descend · R: restart · N: new seed</div>
      </div>
      <canvas id="game" width="800" height="600" aria-label="Dungeon map"></canvas>
      <div id="message-log" aria-live="polite" aria-label="Message log"></div>
    </div>
    <aside class="side-col" aria-label="Equipment and inventory">
      <h2>Equipment</h2>
      <div class="equip-line">Weapon <span class="value" data-hud="weapon">—</span></div>
      <div class="equip-line">Armor <span class="value" data-hud="armor">—</span></div>
      <h2>Inventory</h2>
      <div id="inventory" aria-label="Inventory slots"></div>
    </aside>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
